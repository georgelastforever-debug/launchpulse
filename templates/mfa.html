{% extends "base.html" %}
{% block title %}2FA{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16">
  <div class="bg-white rounded-2xl border border-orange-100 shadow-card p-8">
    <h1 class="text-xl font-extrabold text-slate-900 mb-1">Two-factor authentication</h1>
    <p class="text-sm text-slate-500 mb-6">Enter the code from your authenticator app for <strong>{{ email }}</strong>.</p>
    {% if error %}<div class="mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-sm">{{ error }}</div>{% endif %}
    <form method="POST" class="space-y-4">
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required
             placeholder="6-digit code"
             class="w-full rounded-xl border border-orange-100 px-4 py-3 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-orange-brand/40">
      <button type="submit" class="w-full py-3 rounded-xl text-sm font-bold text-white phase-buy">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
